[project]
name = "ai-collusion"
version = "0.1.0"
description = "Color guessing game: agents coordinate on color conventions through a shared counter channel."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic==1.4.0",
    "docent-python==0.1.75",
    "openai==3.8.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
]

[project.scripts]
ai-collusion-color = "experiments.color_game.cli:main"

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_collusion", "experiments"]

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
